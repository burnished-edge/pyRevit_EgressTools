<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EgressTools: How the occupant markers work</title>
<style>
:root{--red:#FF1F1F;--ink:#262A34;--muted:#646C78;--line:#D7DBE1;--panel:#F5F6F8;--bg:#E9ECF0;
  --room:#485466;--pool:#006EDC;--exit:#188C5A;--auto:#006EDC;--sR:#DC0000;--sO:#F08000;--sY:#C9A200;--sP:#9600C8}
*{box-sizing:border-box}
html{scroll-snap-type:y mandatory}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
#track .snap{height:100vh;scroll-snap-align:start}
#stage{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);position:relative}
#topbar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--red)}
#topbar img{width:30px;height:30px}
.brand{font-weight:800;letter-spacing:2.5px;font-size:15px}
.brand small{display:block;font-weight:600;letter-spacing:1.5px;font-size:10px;color:var(--muted)}
#cardTitle{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}
#progress{position:absolute;left:0;bottom:-1px;height:3px;background:var(--red);transition:width .45s ease}
#viewport{flex:1;position:relative;perspective:1800px;overflow:hidden}
.card{position:absolute;left:50%;top:50%;width:1280px;height:760px;background:#fff;border-radius:18px;
  box-shadow:0 18px 50px rgba(20,30,50,.18);overflow:hidden;
  transition:transform .7s cubic-bezier(.2,.75,.25,1),opacity .55s ease;transform-origin:50% 50%;will-change:transform,opacity}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--red)}
.card.past,.card.next{opacity:0;pointer-events:none}
.card.cur{opacity:1}
#navbar{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;background:#fff;border-top:1px solid var(--line)}
.dots{display:flex;gap:9px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:5px;border:none;padding:0;background:#C3C8CF;cursor:pointer;transition:.25s}
.dot.on{background:var(--red);width:28px}
.dot:focus-visible,.btn:focus-visible,.jump:focus-visible{outline:3px solid #0B5FFF;outline-offset:2px}
.hint{font-size:13px;color:var(--muted);font-weight:600}
.navbtns{display:flex;gap:10px}
.btn{border-radius:10px;padding:10px 20px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.pri{background:var(--red);color:#fff;border:1px solid var(--red)}
.btn.pri:hover{background:#d90f0f}
.btn:disabled{opacity:.35;cursor:default}
.ci{position:absolute;inset:0;padding:34px 46px 30px 56px;display:flex;flex-direction:column}
.eye{font-size:13px;font-weight:800;letter-spacing:2px;color:var(--red)}
.ci h2{font-size:38px;line-height:1.1;margin:6px 0 6px;font-weight:800}
.sub{font-size:17px;color:var(--muted);margin:0 0 18px;line-height:1.4;max-width:1120px}
.rule{height:1px;background:var(--line);margin:0 0 20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1;min-height:0}
.panel{background:var(--panel);border-radius:16px;padding:20px 22px;position:relative}
.panel h3{font-size:21px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:10px}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-size:16px;font-weight:800;align-items:center;justify-content:center;flex:none}
p.t{font-size:15.5px;line-height:1.45;margin:0 0 10px}
p.m{font-size:14.5px;line-height:1.42;margin:0;color:var(--muted)}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:800;letter-spacing:.6px;color:#fff;white-space:nowrap}
.node{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px 11px 18px;position:relative;margin-bottom:10px}
.node::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:6px;border-radius:3px}
.node.r::before{background:var(--room)}.node.p::before{background:var(--pool)}.node.e::before{background:var(--exit)}
.node b{display:block;font-size:15.5px;margin:6px 0 2px}
.node span{font-size:13.5px;color:var(--ink);line-height:1.35;display:block}
.node .tag{display:inline-block}
.node i{font-style:normal;font-size:12.5px;color:var(--muted);display:block;margin-top:4px}
svg text{font-family:'Segoe UI',Arial,sans-serif}
.cover h1{font-size:64px;line-height:1.02;margin:16px 0 14px;font-weight:800}
.cover .lead{font-size:22px;line-height:1.45;color:var(--ink);max-width:640px;margin:0 0 22px}
.toc{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;max-width:640px}
.jump{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid transparent;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.jump:hover{border-color:var(--red)}
.jump span{color:var(--red);font-weight:800;min-width:18px}
.scrollcue{display:flex;align-items:center;gap:10px;margin-top:22px;color:var(--muted);font-weight:700;font-size:14px}
.scrollcue .mouse{width:22px;height:34px;border:2px solid var(--muted);border-radius:12px;position:relative}
.scrollcue .mouse::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--red);animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(-3px)}40%{opacity:1}100%{opacity:0;transform:translateY(9px)}}
/* anatomy */
.anat{display:grid;grid-template-columns:400px 1fr;gap:28px;flex:1;min-height:0}
.pal{border:1px solid #AAB0B8;border-radius:6px;overflow:hidden;font-size:14px;align-self:start}
.pal .ph{background:#E8EAED;padding:5px 12px;font-weight:700}
.pal .pt{padding:5px 12px 6px;border-bottom:1px solid #E1E4E8}
.pal .pt div:last-child{color:var(--muted)}
.pal .grp{background:#E8EAED;padding:4px 12px;font-weight:700;font-size:13.5px}
.pal .row{display:grid;grid-template-columns:52% 48%;border-bottom:1px solid #E7E9EC;transition:background .2s,box-shadow .2s;cursor:pointer;outline:none}
.pal .row div{padding:4px 12px}
.pal .row div+div{border-left:1px solid #E7E9EC}
.pal .row:hover{background:#FFF5F5}
.pal .row.hl{background:#FFECEC;box-shadow:inset 4px 0 0 var(--red)}
.pal .row .hov{float:right;color:var(--red);font-weight:800;opacity:0}
.pal .row.hl .hov{opacity:1}
.pal .row:focus-visible{box-shadow:inset 0 0 0 2px #0B5FFF}
.cb{display:inline-block;width:15px;height:15px;border:1.5px solid var(--ink);vertical-align:-3px;position:relative}
.cb.on::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.pd{background:var(--panel);border-radius:16px;padding:20px 26px;border-left:6px solid var(--red);align-self:stretch;display:flex;flex-direction:column;gap:12px}
.pd.in{animation:pdin .25s ease}
@keyframes pdin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.pdh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pdn{font-size:26px;font-weight:800;color:var(--red)}
.pdq{font-size:18px;font-weight:700;margin-top:2px}
.pds{background:#fff;border-radius:10px;padding:10px 14px;font-size:15.5px;line-height:1.42}
.pdl{font-size:11.5px;font-weight:800;letter-spacing:1.2px;color:var(--muted);margin-bottom:3px}
.pdnote{font-size:14px;color:var(--muted);line-height:1.4;margin-top:auto}
/* auto/manual */
.legend{display:flex;gap:28px;align-items:center;margin-bottom:6px;font-size:15px;font-weight:700}
.legend div{display:flex;align-items:center;gap:6px}
.try{display:grid;grid-template-columns:230px 1fr 340px;gap:20px;align-items:center}
.try label{font-weight:800;font-size:15px;display:block;margin-bottom:6px}
.try input{width:120px;font-size:22px;font-weight:800;padding:6px 10px;border:2px solid var(--red);border-radius:8px;color:var(--ink)}
.try input:focus-visible{outline:3px solid #0B5FFF;outline-offset:2px}
.try .msg{font-size:13px;color:var(--sO);font-weight:700;min-height:18px;margin-top:6px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;font-size:14.5px;line-height:1.35;margin-bottom:7px}
.steps li::before{content:counter(s);display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:13px;flex:none}
.tips div{background:var(--panel);border-radius:10px;padding:6px 12px;margin-bottom:6px;font-size:13px;line-height:1.3}
.tips b{display:block;font-size:14px}
/* workflow */
.band{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:12px}
.band .panel{display:flex;gap:16px;align-items:center;padding:10px 18px}
.band img{width:56px;height:56px;flex:none}
.band b{font-size:17px;display:block;margin-bottom:3px}
.band span{font-size:14px;line-height:1.38;display:block}
.wf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;flex:1;min-height:0}
.step{border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;position:relative}
.step .top{display:flex;justify-content:space-between;align-items:flex-start}
.step img{width:52px;height:52px}
.step h4{font-size:20px;margin:2px 0 5px}
.step ul{margin:6px 0 0;padding:0 0 0 18px;font-size:14px;line-height:1.32}
.step li{margin-bottom:2px}
.step li::marker{color:var(--red)}
.step .res{margin-top:auto;border-top:1px solid var(--line);padding-top:6px}
.step .res .lb{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--auto)}
.tipsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px}
.tipsrow div{font-size:13.5px;line-height:1.35}
.tipsrow b{color:var(--red);display:block;font-size:14.5px}
/* checking */
.chk{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:16px;flex:1;min-height:0}
.chk .panel{padding:14px 20px}
.ph2{display:flex;gap:14px;align-items:flex-start;margin-bottom:8px}
.ph2 img{width:52px;height:52px;flex:none}
.ph2 b{font-size:21px;display:block}
.ph2 span{font-size:14px;color:var(--muted);line-height:1.35;display:block}
.sev{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:2px 8px;margin-bottom:2px}
.sev b{font-size:15px}
.sev span{font-size:13.5px;line-height:1.3}
.print{background:#FFF0F0;border:2px solid var(--red)}
.print label{display:flex;align-items:center;gap:12px;font-size:14.5px;margin:8px 0;cursor:pointer;line-height:1.3}
.print input{width:20px;height:20px;accent-color:var(--red);flex:none}
.print img{width:30px;height:30px;flex:none}
.insp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
.bar{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:8px;margin:7px 0}
.bar i{display:block;height:20px;background:var(--room);border-radius:3px;position:relative}
.bar i::after{content:attr(data-v);position:absolute;left:calc(100% + 8px);top:0;font-style:normal;font-weight:800;font-size:14px}
.rel{display:grid;grid-template-columns:1fr 250px;gap:10px;align-items:start}
.rel ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.38}
.rel li{margin-bottom:3px}
.tiers{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.tiers div{display:flex;align-items:center;gap:8px}
/* reference */
.ref{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;min-height:0;align-items:start}
.grp2{background:var(--panel);border-radius:16px;padding:10px 12px 2px}
.grp2 .gh{display:flex;gap:10px;align-items:center;margin:2px 4px 8px}
.btnc{display:grid;grid-template-columns:48px 1fr;gap:2px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:7px;align-items:center}
.btnc img{width:44px;height:44px;grid-row:span 3}
.btnc b{font-size:15.5px}
.btnc span{font-size:13px;line-height:1.3}
.btnc .tag{grid-column:2;justify-self:start;background:#7A828E;font-size:10px;margin-top:2px}
@media (prefers-reduced-motion:reduce){.card{transition:opacity .2s linear}.scrollcue .mouse::after{animation:none}.pd.in{animation:none}}
@media (max-width:640px){#topbar{padding:0 14px 0 20px}#cardTitle{display:none}#navbar{padding:0 12px}.hint{display:none}.btn{padding:9px 14px;font-size:14px}.dots{gap:6px}.dot.on{width:20px}}
</style>
</head>

const C = {ink:'#262A34',muted:'#646C78',line:'#C9CED5',room:'#485466',pool:'#006EDC',exit:'#188C5A',auto:'#006EDC',
  red:'#DC0000',orange:'#F08000',yellow:'#C9A200',purple:'#9600C8',brand:'#FF1F1F'};
const TIER=['#E61E1E','#005FE6','#00963C','#C800AA','#F08200','#00A0AA'];

/* ---------- SVG helpers ---------- */
/* Revit-style occupant marker: thin circle, bold number, heavy chevron on the side people travel toward. */
function mk(x,y,n,o){
  o=o||{}; const r=o.r||20, col=o.st?C[o.st]:'#111', dir=o.dir||'up';
  const rot={up:0,right:90,down:180,left:270}[dir];
  const fs=String(n).length>2?r*0.86:r*1.02;
  let s=`<g transform="translate(${x},${y})">`;
  s+=`<polyline points="${-1.08*r},${-1.22*r} 0,${-2.2*r} ${1.08*r},${-1.22*r}" fill="none" stroke="${col}" stroke-width="${0.27*r}" stroke-linejoin="miter" stroke-miterlimit="10" transform="rotate(${rot})"/>`;
  s+=`<circle r="${r}" fill="${o.fill||'#fff'}" stroke="${col}" stroke-width="${o.st?2.4:1.4}"/>`;
  s+=`<text y="${fs*0.36}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${col}" font-family="Arial Narrow,Arial,sans-serif">${n}</text>`;
  if(o.mode){const bx=r*0.86,by=r*0.86,bg=o.mode==='A'?C.auto:C.ink;
    s+=`<circle cx="${bx}" cy="${by}" r="${r*0.42}" fill="${bg}" stroke="#fff" stroke-width="1.5"/><text x="${bx}" y="${by+r*0.17}" text-anchor="middle" font-size="${r*0.48}" font-weight="800" fill="#fff">${o.mode}</text>`;}
  return s+'</g>';
}
function chip(x,y,w,h,t,sub,col){
  let s=`<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="12" fill="${col}"/>`;
  if(sub){s+=`<text x="${x}" y="${y-4}" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">${t}</text><text x="${x}" y="${y+20}" text-anchor="middle" font-size="15" fill="#fff">${sub}</text>`;}
  else s+=`<text x="${x}" y="${y+7}" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">${t}</text>`;
  return s;
}
let AID=0;
function arr(x1,y1,x2,y2,col,w,dash){
  col=col||C.muted; w=w||3; const id='a'+(AID++);
  return `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="${w>3?4:5}" markerHeight="${w>3?4:5}" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="${col}"/></marker></defs>`+
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" ${dash?'stroke-dasharray="7 6"':''} marker-end="url(#${id})"/>`;
}
/* overlay-style arc: quadratic curve, repeating small chevrons, bigger one at the end */
function arc(x1,y1,x2,y2,bow,col,dash,w){
  w=w||4.5; const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
  const cx=mx-dy/L*bow, cy=my+dx/L*bow;
  let s=`<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?'stroke-dasharray="9 6"':''} stroke-linecap="round"/>`;
  const at=(t,h)=>{const u=1-t,px=u*u*x1+2*u*t*cx+t*t*x2,py=u*u*y1+2*u*t*cy+t*t*y2,
      tx=2*u*(cx-x1)+2*t*(x2-cx),ty=2*u*(cy-y1)+2*t*(y2-cy),a=Math.atan2(ty,tx);
    return `<polyline points="${px+h*Math.cos(a+Math.PI-0.5)},${py+h*Math.sin(a+Math.PI-0.5)} ${px},${py} ${px+h*Math.cos(a+Math.PI+0.5)},${py+h*Math.sin(a+Math.PI+0.5)}" fill="none" stroke="${col}" stroke-width="${w*0.62}" stroke-linecap="round" stroke-linejoin="round"/>`;};
  s+=at(0.36,7)+at(0.68,7)+at(1,11);
  return s;
}
const ln=(x1,y1,x2,y2,col,w)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col||C.line}" stroke-width="${w||2.5}"/>`;
const tx=(x,y,s,o)=>{o=o||{};return `<text x="${x}" y="${y}" text-anchor="${o.a||'start'}" font-size="${o.s||15}" font-weight="${o.b?800:400}" fill="${o.c||C.ink}">${s}</text>`;};
const check=(x,y,col)=>`<polyline points="${x-10},${y} ${x-3},${y+8} ${x+11},${y-9}" fill="none" stroke="${col||C.exit}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`;
const ic=(k,size,alt)=>`<img src="${ICONS[k]}" width="${size||56}" height="${size||56}" alt="${alt||''}">`;
const head=(i,title,sub)=>`<div class="eye">EGRESSTOOLS &bull; ${i} OF 7</div><h2>${title}</h2><p class="sub">${sub}</p><div class="rule"></div>`;

CARDS.push({title:'What is an occupant marker?',html:`<div class="ci">${head(1,'What is an occupant marker?','A marker sits at a door and shows how many people leave through it. EgressTools links markers together so the numbers always add up.')}
<div class="grid3">
 <div class="panel"><h3><span class="num">1</span>A marker at a door</h3>
  <svg width="330" height="250" viewBox="0 0 330 250" aria-label="A conference room with two doors and a marker at each">
   <rect x="232" y="10" width="92" height="230" fill="#E6E9ED"/>${tx(278,30,'CORRIDOR',{a:'middle',s:12,b:1,c:C.muted})}
   <path d="M232 40 H20 V210 H232 V178 M232 142 V112 M232 76 V40" fill="none" stroke="${C.ink}" stroke-width="6"/>
   <path d="M232 76 h-36 M232 76 a36 36 0 0 1 -36 36" fill="none" stroke="${C.muted}" stroke-width="2"/>
   <path d="M232 142 h-36 M232 142 a36 36 0 0 1 -36 36" fill="none" stroke="${C.muted}" stroke-width="2"/>
   ${tx(110,118,'CONFERENCE',{a:'middle',s:15,b:1,c:C.muted})}${tx(110,140,'load = 40',{a:'middle',s:14,c:C.muted})}
   ${mk(266,94,20,{dir:'right',r:19})}${mk(266,160,20,{dir:'right',r:19})}
  </svg>
  <p class="t">The number is the <b>Occupants</b> value: how many people go through that door. Two doors, two markers: 20 + 20 = 40.</p>
  <p class="m">The heavy chevron shows which way people travel. It's set with Top / Bottom / Left / Right, and EgressTools never changes it.</p>
 </div>
 <div class="panel"><h3><span class="num">2</span>Every marker is an arrow</h3>
  <p class="t">Each marker says: <b>&ldquo;this many people move FROM here TO there.&rdquo;</b></p>
  <svg width="330" height="330" viewBox="0 0 330 330" aria-label="MOC to marker 39 to BRIDGE">
   ${tx(10,52,'EG_From',{b:1,c:C.room,s:15})}${chip(205,46,210,64,'MOC','where they come from',C.room)}
   ${arr(205,80,205,130,C.ink,3)}
   ${tx(10,166,'Occupants',{b:1,s:15})}${mk(205,160,39,{dir:'down',r:24})}
   ${arr(205,222,205,268,C.ink,3)}
   ${tx(10,306,'EG_To',{b:1,c:C.pool,s:15})}${chip(205,300,210,58,'BRIDGE','where they go',C.pool)}
  </svg>
  <p class="m">Rooms, corridors and stairs are called <b>nodes</b>. The Build tools write these names for you, so you rarely type them.</p>
 </div>
 <div class="panel"><h3><span class="num">3</span>Three kinds of nodes</h3>

  <div class="node e"><span class="tag" style="background:var(--exit)">EXIT</span><b>Only receives people.</b><span>A stair or exit door, with a capacity it must not exceed.</span><i>e.g. STAIR 1, STAIR 2</i></div>
  <p class="m">You never label the type. The tool works it out from which way the arrows point.</p>
 </div>

CARDS.push({title:'Anatomy of a marker',html:`<div class="ci">${head(3,'Anatomy of a marker: the Properties palette','EgressTools adds the parameters that start with EG_. Hover over, tap or tab to a row in the palette to see what goes in it.')}
<div class="anat">
 <div>
  <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
   <svg width="54" height="66" viewBox="-30 -54 60 74" aria-hidden="true">${mk(0,0,148,{dir:'up',r:20})}</svg>
   <b style="font-size:15.5px;line-height:1.35">This marker: 148 people go from BRIDGE to STAIR 2, which can hold 220.</b>
  </div>
  <div class="pal" id="pal" role="listbox" aria-label="Marker parameters">

  </div>
 </div>
 <div class="pd" id="pd" aria-live="polite"></div>
</div></div>`,init(card){
  const rows=[...card.querySelectorAll('.row')],pd=card.querySelector('#pd');let sel='Occupants';
  const show=k=>{rows.forEach(r=>{r.classList.toggle('hl',r.dataset.k===k);r.setAttribute('aria-selected',r.dataset.k===k);});
    pd.classList.remove('in');void pd.offsetWidth;pd.innerHTML=pdHTML(k);pd.classList.add('in');};
  rows.forEach(r=>{
    r.addEventListener('mouseenter',()=>show(r.dataset.k));
    r.addEventListener('focus',()=>{sel=r.dataset.k;show(sel);});
    r.addEventListener('click',()=>{sel=r.dataset.k;show(sel);});
    r.addEventListener('keydown',e=>{const i=rows.indexOf(r);
      if(e.key==='ArrowDown'&&rows[i+1]){e.preventDefault();e.stopPropagation();rows[i+1].focus();}
      if(e.key==='ArrowUp'&&rows[i-1]){e.preventDefault();e.stopPropagation();rows[i-1].focus();}});
  });
  card.querySelector('#pal').addEventListener('mouseleave',()=>show(sel));
  show(sel);
}});

];
CARDS.push({title:'Button quick reference',html:`<div class="ci">${head(7,'Button quick reference','The EgressTools tab has five panels, used roughly left to right. Hover over any button in Revit for a short reminder.')}
<div class="ref">${REF.map(col=>`<div style="display:flex;flex-direction:column;gap:12px">${col.map(([n,s,bs])=>`<div class="grp2"><div class="gh"><span class="tag" style="background:var(--red);font-size:12px">${n}</span><b style="color:var(--muted);font-size:14px">${s}</b></div>
 ${bs.map(b=>`<div class="btnc">${ic(b[0],44,b[1]+' icon')}<b>${b[1]}</b><span>${b[2]}</span><span class="tag">${b[3].toUpperCase()}</span></div>`).join('')}</div>`).join('')}</div>`).join('')}</div></div>`});

/* ---------- engine ---------- */
const N=CARDS.length, vp=document.getElementById('viewport'), track=document.getElementById('track'), dotsEl=document.getElementById('dots');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
CARDS.forEach((c,i)=>{
  const s=document.createElement('div');s.className='snap';track.appendChild(s);
  const el=document.createElement('section');el.className='card next';el.setAttribute('aria-label',c.title);el.innerHTML=c.html;vp.appendChild(el);c.el=el;
  if(c.init)c.init(el);
  const d=document.createElement('button');d.type='button';d.className='dot';d.setAttribute('aria-label','Go to card '+(i+1)+': '+c.title);d.addEventListener('click',()=>goTo(i));dotsEl.appendChild(d);
});
const toc=document.getElementById('toc');
CARDS.slice(1).forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='jump';b.innerHTML=`<span>${i+1}</span>${c.title}`;b.addEventListener('click',()=>goTo(i+1));toc.appendChild(b);});

let cur=-1, scale=1;
function fit(){
  const w=vp.clientWidth-32,h=vp.clientHeight-28;
  scale=Math.max(0.2,Math.min(w/1280,h/760,1.25));
  paint();
}
function paint(){
  CARDS.forEach((c,i)=>{
    const d=i-cur, el=c.el, base=`translate(-50%,-50%) scale(${scale})`;
    el.classList.toggle('cur',d===0);el.classList.toggle('past',d<0);el.classList.toggle('next',d>0);
    el.setAttribute('aria-hidden',d!==0);el.inert=d!==0;
    if(reduce){el.style.transform=base;return;}
    if(d===0) el.style.transform=base;
    else if(d<0) el.style.transform=`${base} translateY(-46%) rotateX(68deg) scale(.9)`;
    else el.style.transform=`${base} translateY(34%) rotateX(-18deg) scale(.94)`;
    el.style.zIndex=d===0?3:(d<0?2:1);
  });
}
function setCur(i){
  i=Math.max(0,Math.min(N-1,i)); if(i===cur)return; cur=i; paint();
  [...dotsEl.children].forEach((d,k)=>{d.classList.toggle('on',k===cur);d.setAttribute('aria-current',k===cur?'step':'false');});
  document.getElementById('backBtn').disabled=cur===0;
  document.getElementById('nextBtn').innerHTML=cur===N-1?'Back to start &#8635;':'Next &rsaquo;';
  document.getElementById('progress').style.width=((cur+1)/N*100)+'%';
  document.getElementById('cardTitle').textContent=(cur?cur+' / '+(N-1)+'  \u2022  ':'')+CARDS[cur].title;
}
function goTo(i){i=Math.max(0,Math.min(N-1,i));window.scrollTo({top:i*window.innerHeight,behavior:reduce?'auto':'smooth'});setCur(i);}
function onScroll(){setCur(Math.round(window.scrollY/window.innerHeight));}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',()=>{fit();window.scrollTo({top:cur*window.innerHeight});});
document.getElementById('backBtn').addEventListener('click',()=>goTo(cur-1));
document.getElementById('nextBtn').addEventListener('click',()=>goTo(cur===N-1?0:cur+1));
window.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  const k=e.key;
  if(k==='ArrowDown'||k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.shiftKey)){e.preventDefault();goTo(cur+1);}
  else if(k==='ArrowUp'||k==='ArrowLeft'||k==='PageUp'||(k===' '&&e.shiftKey)){e.preventDefault();goTo(cur-1);}
  else if(k==='Home'){e.preventDefault();goTo(0);} else if(k==='End'){e.preventDefault();goTo(N-1);}
});
fit(); setCur(Math.round(window.scrollY/window.innerHeight)||0);
</script>
</body>
</html>
